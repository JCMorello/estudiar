<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Estudio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow-sm">
                <div class="card-body">
                    <h1 class="text-center mb-4">🧠 Test de Valenciano</h1>

                    <form id="formInicio">
                        <div class="mb-3">
                            <label for="tema" class="form-label">Tema:</label>
                            <select class="form-select" id="tema" required>
                                <option value="">Cargando temas...</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="num_preguntas" class="form-label">Número de preguntas:</label>
                            <input type="number" class="form-control" id="num_preguntas"
                                   min="1" max="31" value="31" required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">Comenzar Test</button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
